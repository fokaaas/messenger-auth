<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set PIN</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        h2 { color: #333; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center; letter-spacing: 8px; }
        button { padding: 12px; background: #0088cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006699; }
        .error { color: red; margin-bottom: 10px; }
        .hint { color: #888; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Create Session PIN</h2>
    <p>Set a 4-to-6 digit PIN for quick session access</p>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" maxlength="6" pattern="\d{4,6}" placeholder="****" required>
        <p class="hint">Enter 4 to 6 digits</p>

        <label for="confirm_pin">Confirm PIN</label>
        <input type="password" id="confirm_pin" name="confirm_pin" maxlength="6" pattern="\d{4,6}" placeholder="****" required>

        <button type="submit">Set PIN</button>
    </form>
</body>
</html>
