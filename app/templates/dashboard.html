<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; text-align: center; }
        h2 { color: #333; }
        p { color: #555; }
        .phone { font-weight: bold; color: #0088cc; }
        a { color: #0088cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Welcome!</h2>
    <p>You are logged in as <span class="phone">{{ phone }}</span></p>
    <p><a href="/logout">Logout</a></p>
</body>
</html>
