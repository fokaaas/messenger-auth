<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        h2 { color: #333; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px; background: #0088cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006699; }
        .error { color: red; margin-bottom: 10px; }
        .links { margin-top: 16px; font-size: 14px; }
        .links a { color: #0088cc; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Account Recovery</h2>
    <p>Enter your phone number to receive a verification code</p>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>

        <button type="submit">Send Verification Code</button>
    </form>
    <div class="links">
        <a href="/login">Back to Login</a>
    </div>
</body>
</html>
