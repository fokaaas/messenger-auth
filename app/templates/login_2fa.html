<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 2FA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        h2 { color: #333; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center; letter-spacing: 4px; }
        button { padding: 12px; background: #0088cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006699; }
        .error { color: red; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Login - Two-Factor Authentication</h2>
    <p>Enter the 6-digit code from your authenticator app</p>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <label for="totp_code">Authentication Code</label>
        <input type="text" id="totp_code" name="totp_code" maxlength="6" pattern="\d{6}" placeholder="000000" required>

        <button type="submit">Verify</button>
    </form>
</body>
</html>
