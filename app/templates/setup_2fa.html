<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Setup - Step 4</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        h2 { color: #333; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center; letter-spacing: 4px; }
        button { padding: 12px; background: #0088cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006699; }
        .error { color: red; margin-bottom: 10px; }
        .qr-container { text-align: center; margin: 20px 0; }
        .qr-container img { border: 4px solid #eee; border-radius: 8px; }
        .uri { word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <h2>Registration - Step 4</h2>
    <p>Scan the QR code with Google Authenticator or a compatible app</p>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="qr-container">
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" width="200" height="200">
    </div>

    <p><strong>Manual entry URI:</strong></p>
    <div class="uri">{{ provisioning_uri }}</div>

    <form method="POST" action="/confirm-2fa">
        <label for="totp_code">Enter the 6-digit code from your authenticator app</label>
        <input type="text" id="totp_code" name="totp_code" maxlength="6" pattern="\d{6}" placeholder="000000" required>

        <button type="submit">Verify & Complete Registration</button>
    </form>
</body>
</html>
